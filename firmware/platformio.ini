; PlatformIO 工程配置：ESP32-S3 双轴目标锁定舵盘固件
; 工具链 VSCode + PlatformIO（Arduino 框架）+ C++17
;
; 外部库只依赖 esp32-camera；LEDC、PCNT、Preferences、esp_heap_caps 都来自
; Arduino-ESP32 内置的 ESP-IDF 组件。

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 开发板板载 16MB Flash，必须用官方 16MB 分区表，否则默认 4MB 布局装不下
; 摄像头固件与保留空间。
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; 该板为 8MB OPI PSRAM 版本。摄像头帧缓冲与视觉工作缓冲全部放 PSRAM，
; 若不显式声明内存类型，Arduino 内核不会初始化 PSRAM，运行时分配会失败。
; qio_opi = Flash 走 QIO、PSRAM 走 OPI。
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; 串口监视器波特率，与 telemetryInit() 的默认值保持一致。
monitor_speed = 115200

; 上传速率留待实测：不同 USB 转串口芯片稳定性差异很大，先不写死。
; upload_speed = 921600   ; 待实测标定

; Arduino 默认用 gnu++11，这里强制切到 gnu++17（项目要求 C++17）。
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM                 ; 通知内核启用并使用 PSRAM
    -DCORE_DEBUG_LEVEL=3              ; 内核日志 WARN 级，够排障又不刷屏（发布环境覆盖为 0）
    -DAIM_VERBOSE_TELEMETRY=1         ; 逐帧遥测：开发期打开，发布环境置 0

lib_deps =
    espressif/esp32-camera

; 发布环境：在开发环境基础上加优化、去掉断言、关掉逐帧遥测。
; build_flags 重新声明会覆盖父环境，必须用 ${env:...} 显式引用父值再追加。
[env:esp32-s3-devkitc-1-release]
extends = env:esp32-s3-devkitc-1
; 注意：PlatformIO 对列表型选项（build_flags/build_unflags）是整体替换而非合并，
; 子环境一旦重新声明就会丢掉父环境的值。这里必须显式插值继承父环境的 unflags，
; 否则 release 会丢失 -std=gnu++11 的移除项，导致命令行上同时出现 gnu++11 与 gnu++17。
build_unflags =
    ${env:esp32-s3-devkitc-1.build_unflags}
    -DAIM_VERBOSE_TELEMETRY=1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -O2                               ; 发布用体积换速度：视觉/控制每帧都跑，值得
    -DNDEBUG                          ; 关闭 assert，避免发布固件因断言复位
    -DAIM_VERBOSE_TELEMETRY=0         ; 关闭逐帧 CSV，仅保留低频心跳
